apiVersion: 1

# Dashboards versioned in infra/grafana/dashboards/ (e.g. "Lever / Decisão", spec 001 section 10).
providers:
  - name: lever
    folder: Lever
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
