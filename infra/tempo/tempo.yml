# Grafana Tempo in single-binary mode for local traces (spec 001 section 10; quality plan, D9).
# Receives OTLP over HTTP from services/decision and apps/console and keeps traces on a local
# volume. Grafana reads them through the "Tempo" datasource.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
