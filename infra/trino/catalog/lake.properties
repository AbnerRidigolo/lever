# Trino catalog "lake": Iceberg tables behind the REST catalog, files in SeaweedFS (S3).
# ${ENV:...} values come from the trino service environment in infra/docker-compose.yml.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://${ENV:LAKE_BUCKET}/warehouse
fs.native-s3.enabled=true
s3.endpoint=${ENV:LAKE_S3_ENDPOINT}
s3.region=${ENV:LAKE_S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKE_S3_SECRET_KEY}
