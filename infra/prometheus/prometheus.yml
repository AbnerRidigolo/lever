global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # services/decision running on the host (pnpm --filter @lever/decision dev or start).
  # Change the port here if you change DECISION_PORT.
  - job_name: decision
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4000']

  # apps/store running on the host (pnpm --filter @lever/store dev or start): SDK metrics of
  # spec 001 section 10 (store plan, D8).
  - job_name: store
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3002']
